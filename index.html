<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Dashboard | App Finanças</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <header>

        <div class="topo-linha">

            <h1>App Finanças</h1>

            <div class="acoes-login">

                <button id="btnLogin" type="button">
                    Entrar com Google
                </button>

                <button id="btnSair" type="button" hidden>
                    Sair
                </button>

            </div>

        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="contas.html">Contas</a>
            <a href="cartao.html">Cartões</a>
        </nav>

    </header>

    <main>

        <h2>Parcelamentos dos Cartões de Crédito</h2>

        <p id="status" role="status" aria-live="polite">
            Aguardando carregamento.
        </p>

        <section class="painel-parcelamentos">

            <h3>Compras parceladas</h3>

            <div class="tabela-rolagem">

                <table id="tabelaParcelamentos">

                    <thead>
                        <tr>
                            <th>Cartão</th>
                            <th>Descrição da compra</th>
                            <th>Parcelas</th> 
                            <th>Valor da parcela</th>
                            <th>Restantes</th>                           
                        </tr>
                    </thead>

                    <tbody id="listaParcelamentos">

                        <tr>
                            <td colspan="5">
                                Aguardando dados dos cartões.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

        
        <!-- ==========================================
            PAGINAÇÃO DOS PARCELAMENTOS
        ========================================== -->

        <div class="paginacao-dashboard">

            <span id="infoPaginaDashboard">
                0 registros
            </span>

            <div class="paginacao-botoes">

                <button
                    type="button"
                    id="paginaAnteriorDashboard"
                    disabled>
                    Anterior
                </button>

                <span id="numeroPaginaDashboard">
                    Página 1 de 1
                </span>

                <button
                    type="button"
                    id="paginaProximaDashboard"
                    disabled>
                    Próxima
                </button>

            </div>

        </div>


    </main>

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
